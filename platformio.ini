; LapLogic - PlatformIO build
; Uses the same source as the Arduino IDE sketch in ./LapLogic
;
;   Guition JC4827W543C : pio run -e jc4827w543 -t upload
;   CYD ESP32-2432S028R : pio run -e cyd -t upload

[platformio]
src_dir = LapLogic

[common]
platform = espressif32@6.9.0          ; = ESP32 Arduino core 2.0.17
framework = arduino
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  lvgl/lvgl@8.3.11
  bblanchon/ArduinoJson@7.2.1
  tzapu/WiFiManager@2.0.17
  knolleary/PubSubClient@2.8
build_flags =
  -DLV_CONF_INCLUDE_SIMPLE
  -I LapLogic
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Guition JC4827W543C - ESP32-S3-WROOM-1 N4R8: 4 MB flash, 8 MB octal PSRAM
[env:jc4827w543]
platform = ${common.platform}
framework = ${common.framework}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_speed = ${common.upload_speed}
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
board_build.partitions = min_spiffs.csv      ; two app slots, for updates over Wi-Fi
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-2432S028R "Cheap Yellow Display" - ESP32-WROOM-32: 4 MB flash, no PSRAM
[env:cyd]
platform = ${common.platform}
framework = ${common.framework}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_speed = ${common.upload_speed}
board = esp32dev
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
board_build.partitions = min_spiffs.csv      ; two app slots, for updates over Wi-Fi
build_flags = ${common.build_flags}
